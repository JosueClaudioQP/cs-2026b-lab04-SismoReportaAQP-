name: fitness-functions
on:
  pull_request:
  push:
    branches: [main]
jobs:
  arquitectura:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lab08.txt
      - run: pip install -r requirements-lab08.txt
      - run: lint-imports --no-cache
      - run: python -m pytest -v
      - run: python tools/medir_lab08.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar modelo C4
        run: |
          curl -fL https://github.com/structurizr/cli/releases/download/v2025.11.09/structurizr-cli.zip -o /tmp/structurizr.zip
          unzip -q /tmp/structurizr.zip -d /tmp/structurizr
          bash /tmp/structurizr/structurizr.sh validate -workspace docs/architecture/c4/workspace.dsl
      - uses: actions/upload-artifact@v4
        with:
          name: evidencia-lab08
          path: docs/architecture/evidencia/
